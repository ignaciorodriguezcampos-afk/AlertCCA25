name: Vigilancia Camara de Cuentas

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vigilancia:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Comprobar publicaciones
        run: python vigilancia.py
        run: pip install requests beautifulsoup4

      - name: Comprobar publicaciones
        run: python vigilancia.py
