name: Vigilancia Camara de Cuentas

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigilancia-cca
  cancel-in-progress: false

jobs:
  vigilancia:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Comprobar nuevas publicaciones
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python vigilancia.py

      - name: Guardar historial de enlaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add enlaces_detectados.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial de publicaciones"
            git push
          fi
